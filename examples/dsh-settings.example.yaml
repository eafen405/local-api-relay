# DSH（DeepSeek Harness）接入本地中转的配置模板

供服务器上的部署 agent 参考。放入 `$DSH_HOME/settings.yaml`（热加载，无需重启）。
密钥变量写在 `$DSH_HOME/.credentials.yaml`，形如：

```yaml
LOCAL_DEEPSEEK_API_KEY: lar_...
LOCAL_GPT_API_KEY: lar_...
```

```yaml
# 主代理默认模型：走中转的 chat_completions 协议
agent-default-model:
  provider: local-deepseek
  model: <你的发布模型名，例如 deepseek-v4-pro>
  reasoningEffort: max

llm-pi-ai:
  providers:
    # chat_completions 协议：只服务 /v1/chat/completions 的中转路由
    local-deepseek:
      displayName: local-deepseek
      apiKeyEnv: LOCAL_DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: http://127.0.0.1:8787/v1
      # 若上游模型是 deepseek 思考模型，保留 thinkingFormat: deepseek；普通模型删掉整段 compat
      compat:
        thinkingFormat: deepseek
      models:
        - id: <发布模型名 A>
        - id: <发布模型名 B>

    # responses 协议：只服务 /v1/responses 的中转路由
    local-gpt:
      displayName: local-gpt
      apiKeyEnv: LOCAL_GPT_API_KEY
      api: openai-responses
      baseURL: http://127.0.0.1:8787/v1
      models:
        - id: <发布模型名 C>
```

子代理固定模型：写在 preset 的 `agent.cordis.yml`（例如 `$DSH_HOME/.agent-presets/<preset>/agent.cordis.yml`），
把 `tool-subagent` 与 `tool-subagent-fork` 两行的 `agentOptions` 指向中转路由：

```yaml
agentOptions:
  provider: local-deepseek
  model: <你的发布模型名，例如 deepseek-v4-flash>
```

注意：
- 发布模型名必须与中转里 `POST /admin/published-models` 的 `name` 完全一致；
- 协议必须匹配：中转的 `chat_completions` 路由用 `api: openai-completions`，`responses` 路由用 `api: openai-responses`；
- 密钥变量名（`LOCAL_DEEPSEEK_API_KEY` 等）对应 `.credentials.yaml` 里的 key，值为中转创建的 `lar_...` 密钥。

